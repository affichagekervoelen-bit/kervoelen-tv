<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111111;
  font-family: Arial, sans-serif;
}

.ticker {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  overflow: hidden;
  border-top: 3px solid #f4c20d;
  border-bottom: 3px solid #f4c20d;
  box-sizing: border-box;
}

.ticker-track {
  display: flex;
  width: max-content;
  white-space: nowrap;
  animation: scroll 50s linear infinite;
}

.ticker-content {
  display: flex;
  flex-shrink: 0;
}

.item {
  display: flex;
  align-items: center;
  font-size: 4.5vh;
  font-weight: 700;
  color: white;
  margin-right: 55px;
}

.price {
  color: #f4c20d;
  margin-left: 14px;
}

.up {
  color: #38d66b;
  margin-left: 10px;
}

.down {
  color: #ff4d4d;
  margin-left: 10px;
}

.separator {
  color: #f4c20d;
  margin-left: 35px;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
</style>
</head>

<body>

<div class="ticker">
  <div class="ticker-track" id="track"></div>
</div>

<script>

const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRHVwxFF8EtnjJ3l22DAsEHPXpF_UmZ13_azpmzSweG2NMwTA8OowKFDqsmHEn5GXMvug7ii0JZCgUv/pub?gid=0&single=true&output=csv";

function parseCSV(text) {

  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];

    if (char === '"') {
      if (insideQuotes && text[i + 1] === '"') {
        value += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    }

    else if (char === "," && !insideQuotes) {
      row.push(value);
      value = "";
    }

    else if ((char === "\n" || char === "\r") && !insideQuotes) {

      if (char === "\r" && text[i + 1] === "\n") {
        i++;
      }

      row.push(value);

      if (row.some(cell => cell !== "")) {
        rows.push(row);
      }

      row = [];
      value = "";
    }

    else {
      value += char;
    }
  }

  if (value || row.length) {
    row.push(value);
    rows.push(row);
  }

  return rows;
}

async function loadPrices() {

  try {

    const response = await fetch(csvURL + "&t=" + Date.now());
    const text = await response.text();

    const rows = parseCSV(text).slice(1);

    let html = "";

    rows.forEach(cols => {

      const material = (cols[0] || "").trim();
      const price = (cols[1] || "").trim();
      const unit = (cols[3] || "").trim();
      const evolution = (cols[4] || "").trim();

      if (!material || !price) return;

      let arrow = "";

      if (evolution === "↑") {
        arrow = '<span class="up">▲</span>';
      }

      if (evolution === "↓") {
        arrow = '<span class="down">▼</span>';
      }

      html += `
        <div class="item">
          ${material.toUpperCase()}
          <span class="price">${price} ${unit}</span>
          ${arrow}
          <span class="separator">•</span>
        </div>
      `;
    });

    document.getElementById("track").innerHTML =
      `<div class="ticker-content">${html}</div>
       <div class="ticker-content">${html}</div>`;

  } catch (error) {
    console.error(error);
  }
}

loadPrices();
setInterval(loadPrices, 300000);

</script>

</body>
</html>
