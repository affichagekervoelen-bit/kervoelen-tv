<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111111;
  font-family: Arial, sans-serif;
}

.ticker {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  overflow: hidden;
  border-top: 3px solid #f4c20d;
  border-bottom: 3px solid #f4c20d;
  box-sizing: border-box;
}

.ticker-track {
  display: flex;
  align-items: center;
  width: max-content;
  white-space: nowrap;
  animation: scroll 45s linear infinite;
}

.ticker-content {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.item {
  display: inline-flex;
  align-items: center;
  font-size: 4.5vh;
  font-weight: 700;
  color: white;
  margin-right: 55px;
}

.price {
  color: #f4c20d;
  margin-left: 12px;
}

.up {
  color: #35d06f;
  margin-left: 8px;
}

.down {
  color: #ff4d4d;
  margin-left: 8px;
}

.separator {
  color: #f4c20d;
  margin-left: 35px;
}

@keyframes scroll {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
</style>
</head>

<body>

<div class="ticker">
  <div class="ticker-track" id="track"></div>
</div>

<script>

const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRHVwxFF8EtnjJ3l22DAsEHPXpF_UmZ13_azpmzSweG2NMwTA8OowKFDqsmHEn5GXMvug7ii0JZCgUv/pub?gid=0&single=true&output=csv";

async function loadPrices() {

  try {

    const response = await fetch(csvURL + "&t=" + Date.now());
    const text = await response.text();

    const rows = text.trim().split("\n").slice(1);

    let html = "";

    rows.forEach(row => {

      const cols = row
        .split(",")
        .map(c => c.replace(/^"|"$/g, "").trim());

      const material = cols[0];
      const price = cols[1];
      const unit = cols[3];
      const evolution = cols[4];

      if (!material || !price) return;

      let arrow = "";

      if (evolution === "↑") {
        arrow = '<span class="up">▲</span>';
      }

      if (evolution === "↓") {
        arrow = '<span class="down">▼</span>';
      }

      html += `
        <span class="item">
          ${material.toUpperCase()}
          <span class="price">${price} ${unit}</span>
          ${arrow}
          <span class="separator">•</span>
        </span>
      `;
    });

    /* Deux copies identiques = défilement continu */
    document.getElementById("track").innerHTML =
      `<div class="ticker-content">${html}</div>
       <div class="ticker-content">${html}</div>`;

  }

  catch(error) {
    console.error("Erreur chargement tarifs :", error);
  }
}

loadPrices();

/* Actualisation automatique toutes les 5 minutes */
setInterval(loadPrices, 300000);

</script>

</body>
</html>
